[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sitrus"
version = "0.1.0"
description = "Sistem Triase Sertifikasi Perangkat (DJID / Balmon)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "python-Levenshtein>=0.21.0",
    "pyahocorasick>=2.0.0",
    "rank-bm25>=0.2.2",
    "lightgbm>=4.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "rq>=1.16.0",
    "redis>=5.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["packages", "."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
